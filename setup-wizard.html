<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup | IndexField</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="favicon.png">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: {
                        charcoal: '#111827',
                        graphite: '#1F2937',
                        slate: '#475569',
                        'safety-orange': '#F97316',
                        'burnt-orange': '#EA580C',
                        'success-green': '#22C55E',
                        'warning-amber': '#FACC15',
                        'critical-red': '#EF4444',
                        'data-cyan': '#06B6D4',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #111827; color: #F8FAFC; overflow-x: hidden; }
        
        .glass-card { background: linear-gradient(180deg, rgba(31,41,55,0.95) 0%, rgba(24,31,46,0.98) 100%); border: 1px solid rgba(100,116,139,0.12); backdrop-filter: blur(10px); }
        .glass-input { background: rgba(31,41,55,0.5); border: 1px solid rgba(100,116,139,0.25); transition: all 0.3s ease; }
        .glass-input:focus { background: rgba(31,41,55,0.7); border-color: rgba(249, 115, 22, 0.4); box-shadow: 0 0 20px rgba(249, 115, 22, 0.1); }
        
        .gradient-text { background: linear-gradient(135deg, #F97316 0%, #EA580C 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        
        @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 0 1px rgba(249, 115, 22, 0.3); } 50% { box-shadow: 0 0 0 2px rgba(249, 115, 22, 0.5); } }
        .pulse-btn { animation: pulse-glow 2s ease-in-out infinite; }
        
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes module-pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
        .module-active { animation: module-pulse 0.5s ease-in-out; }
        
        .step-tile { transition: all 0.2s ease; }
        .step-tile:hover { border-color: rgba(249, 115, 22, 0.5); }
        .step-tile.selected { border-color: #F97316; background: rgba(249, 115, 22, 0.05); }
        
        .drag-handle { cursor: grab; }
        .drag-handle:active { cursor: grabbing; }
        
        .terminal-line { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
        
        /* Custom slider */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            background: rgba(100, 116, 139, 0.3);
            border-radius: 3px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: #F97316;
            border-radius: 50%;
            cursor: pointer;
        }
        
        /* Toggle switch */
        .toggle-switch { position: relative; width: 44px; height: 24px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider {
            position: absolute; cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(100, 116, 139, 0.3);
            transition: 0.3s;
            border-radius: 24px;
        }
        .toggle-slider:before {
            position: absolute; content: "";
            height: 18px; width: 18px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }
        input:checked + .toggle-slider { background-color: #F97316; }
        input:checked + .toggle-slider:before { transform: translateX(20px); }
        
        .progress-bar { background: rgba(100, 116, 139, 0.2); }
        .progress-fill { background: #F97316; transition: width 0.5s ease; }
        
        .error-text { color: #F97316; font-size: 11px; font-family: 'JetBrains Mono', monospace; margin-top: 4px; }
    </style>
</head>
<body class="min-h-screen">
    <!-- Progress Bar -->
    <div class="fixed top-0 left-0 right-0 h-1 progress-bar z-50">
        <div id="progress-fill" class="h-full progress-fill" style="width: 16.66%"></div>
    </div>
    
    <!-- Step Indicator -->
    <div class="fixed top-4 left-0 right-0 z-40 flex justify-center">
        <div id="step-indicator" class="glass-card px-4 py-2 rounded-full">
            <span class="text-xs font-mono text-slate-400">STEP 1 OF 6 · FACILITY IDENTITY</span>
        </div>
    </div>
    
    <!-- Main Container -->
    <div id="wizard-container" class="min-h-screen pt-20">
        <!-- Content will be injected by JavaScript -->
    </div>
    
    <!-- Deploy Overlay -->
    <div id="deploy-overlay" class="hidden fixed inset-0 z-[200] bg-black/95 flex items-center justify-center">
        <div class="max-w-2xl w-full p-8">
            <div id="deploy-terminal" class="font-mono text-sm space-y-2">
                <!-- Terminal lines will be injected -->
            </div>
        </div>
    </div>

    <script>
        // =============================================
        // SETUP WIZARD STATE
        // =============================================
        let currentStep = 1;
        const totalSteps = 6;
        let wizardData = {
            facilityName: '',
            location: '',
            technicianCount: 47,
            language: 'ENGLISH',
            industry: '',
            industryOther: '',
            role: '',
            modules: [],
            priorities: [
                'downtime',
                'compliance',
                'accountability',
                'lifecycle'
            ],
            criticalAsset: '',
            manualFile: null
        };
        
        let isInvitedUser = false;
        let inviteFacilityName = '';
        let inviteRole = '';
        
        const INDUSTRIES = [
            { id: 'manufacturing', name: 'MANUFACTURING', desc: 'General production and assembly', icon: 'fa-industry' },
            { id: 'oil_gas', name: 'OIL & GAS', desc: 'Upstream, midstream, downstream operations', icon: 'fa-oil-can' },
            { id: 'chemical', name: 'CHEMICAL PROCESSING', desc: 'Process safety and EPA compliance focus', icon: 'fa-flask' },
            { id: 'food_beverage', name: 'FOOD & BEVERAGE', desc: 'HACCP, FDA, and sanitation protocols', icon: 'fa-utensils' },
            { id: 'pharmaceutical', name: 'PHARMACEUTICAL', desc: 'FDA 21 CFR, GMP, batch record compliance', icon: 'fa-pills' },
            { id: 'utilities', name: 'UTILITIES & ENERGY', desc: 'Power generation and grid operations', icon: 'fa-bolt' },
            { id: 'mining', name: 'MINING & EXTRACTION', desc: 'Heavy equipment and hazardous operations', icon: 'fa-mountain' },
            { id: 'water', name: 'WATER & WASTEWATER', desc: 'EPA compliance and treatment operations', icon: 'fa-water' },
            { id: 'other', name: 'OTHER', desc: 'Custom configuration — specify below', icon: 'fa-cog' }
        ];
        
        const ROLES = [
            { id: 'plant_manager', name: 'PLANT MANAGER / OWNER', desc: 'Full facility oversight and control', access: 'FULL ACCESS', canSee: ['all'] },
            { id: 'operations_supervisor', name: 'OPERATIONS SUPERVISOR', desc: 'Shift and operations management', access: 'OPERATIONAL ACCESS', canSee: ['operations', 'assets', 'manuals', 'workorders'] },
            { id: 'maintenance_technician', name: 'MAINTENANCE TECHNICIAN', desc: 'Daily maintenance and floor operations', access: 'TECHNICIAN ACCESS', canSee: ['assets', 'manuals', 'workorders'] },
            { id: 'safety_officer', name: 'SAFETY OFFICER', desc: 'Safety compliance and incident management', access: 'SAFETY ACCESS', canSee: ['incidents', 'manuals', 'loto', 'compliance'] },
            { id: 'quality_manager', name: 'QUALITY / COMPLIANCE MANAGER', desc: 'Documentation and regulatory compliance', access: 'COMPLIANCE ACCESS', canSee: ['documents', 'compliance', 'audits'] },
            { id: 'read_only', name: 'READ ONLY / CONTRACTOR', desc: 'Temporary or view-only access', access: 'VIEW ONLY', canSee: ['manuals', 'assets'] }
        ];
        
        const MODULES = [
            { id: 'document_control', name: 'DOCUMENT CONTROL', desc: 'SOPs, manuals, compliance docs — AI-indexed and searchable in seconds', icon: 'fa-file-alt' },
            { id: 'asset_registry', name: 'ASSET REGISTRY', desc: 'Every machine, every spec, every service history. One record per asset', icon: 'fa-server' },
            { id: 'maintenance_intelligence', name: 'MAINTENANCE INTELLIGENCE', desc: 'Scheduled and predictive PM built around your shift patterns and manual data', icon: 'fa-tools' },
            { id: 'incident_command', name: 'INCIDENT COMMAND', desc: 'First report to root cause close-out with full audit trail', icon: 'fa-exclamation-triangle' },
            { id: 'loto_command', name: 'LOTO COMMAND', desc: 'Lockout/Tagout permit logging, procedure runner, and compliance export', icon: 'fa-lock' },
            { id: 'shift_intelligence', name: 'SHIFT INTELLIGENCE', desc: 'Pre-shift briefing, shift log, and AI-generated handover briefs', icon: 'fa-users-clock' }
        ];
        
        const PRIORITIES = [
            { id: 'downtime', name: 'REDUCE UNPLANNED DOWNTIME', desc: 'Surface overdue maintenance, flag equipment observations, predict failures before they happen' },
            { id: 'compliance', name: 'COMPLIANCE DOCUMENTATION', desc: 'Keep audit trails clean, track certification deadlines, generate compliance reports fast' },
            { id: 'accountability', name: 'TECHNICIAN ACCOUNTABILITY', desc: 'Know who did what and when. Work orders, LOTO permits, shift logs all signed' },
            { id: 'lifecycle', name: 'ASSET LIFECYCLE TRACKING', desc: 'Full history on every machine from install to decommission' }
        ];
        
        const COMPLIANCE_MAP = {
            'pharmaceutical': 'FDA 21 CFR PART 11',
            'chemical': 'EPA PSM / RMP',
            'oil_gas': 'API RP 54',
            'food_beverage': 'FDA FSMA',
            'mining': 'MSHA'
        };
        
        const MODULE_TERMINOLOGY_MAP = {
            'oil_gas': { assets: 'Pressure Systems' },
            'pharmaceutical': { documents: 'Batch Records' },
            'chemical': { incidents: 'Process Safety Events' },
            'food_beverage': { documents: 'Recipe & SOP Vault' },
            'mining': { assets: 'Heavy Equipment Registry' }
        };

        // =============================================
        // INITIALIZATION
        // =============================================
        async function initWizard() {
            // Check for invite token in URL
            const urlParams = new URLSearchParams(window.location.search);
            const inviteToken = urlParams.get('invite');
            
            if (inviteToken) {
                await handleInviteToken(inviteToken);
            }
            
            // Check if user has facility
            await checkUserFacility();
            
            renderStep(currentStep);
        }
        
        async function checkUserFacility() {
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (!session) {
                    window.location.href = 'signin.html';
                    return;
                }
                
                const { data: profile } = await supabaseClient
                    .from('profiles')
                    .select('current_facility_id')
                    .eq('id', session.user.id)
                    .single();
                
                if (profile && profile.current_facility_id) {
                    // User already has facility, check if setup is complete
                    const { data: facility } = await supabaseClient
                        .from('facilities')
                        .select('setup_complete')
                        .eq('id', profile.current_facility_id)
                        .single();
                    
                    if (facility && facility.setup_complete) {
                        // Setup already complete, redirect to dashboard
                        window.location.href = 'dashboard.html';
                        return;
                    } else if (facility) {
                        // Facility exists but setup not complete - invited user
                        isInvitedUser = true;
                        const { data: facilityData } = await supabaseClient
                            .from('facilities')
                            .select('name, industry')
                            .eq('id', profile.current_facility_id)
                            .single();
                        
                        if (facilityData) {
                            inviteFacilityName = facilityData.name;
                            wizardData.industry = facilityData.industry;
                        }
                        
                        // Check if role is pre-set
                        const { data: member } = await supabaseClient
                            .from('facility_members')
                            .select('role')
                            .eq('facility_id', profile.current_facility_id)
                            .eq('user_id', session.user.id)
                            .single();
                        
                        if (member && member.role) {
                            inviteRole = member.role;
                            wizardData.role = member.role;
                        }
                    }
                }
            } catch (e) {
                console.warn('Facility check failed:', e);
            }
        }
        
        async function handleInviteToken(token) {
            try {
                const response = await fetch(`${window.location.origin}/api/facility/accept-invite`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token })
                });
                
                if (response.ok) {
                    // Invite accepted, reload to check facility
                    window.location.href = 'setup-wizard.html';
                }
            } catch (e) {
                console.warn('Invite handling failed:', e);
            }
        }

        // =============================================
        // STEP RENDERING
        // =============================================
        function renderStep(step) {
            console.log('renderStep called with:', step);
            updateProgress(step);
            updateStepIndicator(step);

            const container = document.getElementById('wizard-container');

            try {
                switch(step) {
                    case 1:
                        container.innerHTML = getStep1HTML();
                        break;
                    case 2:
                        container.innerHTML = getStep2HTML();
                        break;
                    case 3:
                        container.innerHTML = getStep3HTML();
                        break;
                    case 4:
                        container.innerHTML = getStep4HTML();
                        break;
                    case 5:
                        console.log('Rendering step 5');
                        container.innerHTML = getStep5HTML();
                        console.log('Step 5 rendered successfully');
                        break;
                    case 6:
                        container.innerHTML = getStep6HTML();
                        break;
                    default:
                        console.log('Unknown step:', step);
                }
            } catch (error) {
                console.error('Error rendering step:', step, error);
                container.innerHTML = `<div class="p-8 text-red-500">Error loading step: ${error.message}</div>`;
            }

            // Initialize event listeners after rendering
            setTimeout(() => initializeStepEvents(step), 0);
        }
        
        function updateProgress(step) {
            const progress = (step / totalSteps) * 100;
            document.getElementById('progress-fill').style.width = `${progress}%`;
        }
        
        function updateStepIndicator(step) {
            const stepNames = [
                'FACILITY IDENTITY',
                'INDUSTRY AND COMPLIANCE',
                'YOUR ROLE',
                'MODULE ACTIVATION',
                'YOUR PRIORITIES',
                'YOUR CRITICAL ASSET'
            ];
            
            const indicator = document.getElementById('step-indicator');
            indicator.innerHTML = `<span class="text-xs font-mono text-slate-400">STEP ${step} OF ${totalSteps} · ${stepNames[step - 1]}</span>`;
        }

        // =============================================
        // STEP 1: FACILITY IDENTITY
        // =============================================
        function getStep1HTML() {
            const nodeId = wizardData.facilityName ? `${wizardData.facilityName.split(' ')[0].toUpperCase()}-PLANT-01` : 'NODE-PLANT-01';
            
            return `
                <div class="flex flex-col lg:flex-row min-h-screen">
                    <!-- Left Panel - Form (55%) -->
                    <div class="w-full lg:w-[55%] p-8 lg:p-16 flex flex-col justify-center">
                        <div class="max-w-xl mx-auto w-full space-y-8 animate-in">
                            <!-- Eyebrow -->
                            <div class="text-xs font-mono text-safety-orange">STEP 1 OF 6</div>
                            
                            <!-- Heading -->
                            <h1 class="text-3xl lg:text-4xl font-bold tracking-tight">Let's build your facility node.</h1>
                            <p class="text-slate-400">This becomes your operational command center. Everything IndexField does will be configured around your facility.</p>
                            
                            <!-- Form -->
                            <div class="space-y-6">
                                <!-- Facility Name -->
                                <div>
                                    <label class="block text-sm font-medium text-slate-300 mb-2">Facility Name *</label>
                                    <input type="text" id="facility-name" value="${wizardData.facilityName}" placeholder="e.g. Harwick Processing, Valley Manufacturing"
                                        class="w-full px-4 py-3 glass-input rounded-lg text-white placeholder-slate-500 text-lg"
                                        oninput="updateFacilityName(this.value)">
                                    <div id="facility-name-error" class="error-text hidden">FACILITY NAME REQUIRED</div>
                                </div>
                                
                                <!-- Location -->
                                <div>
                                    <label class="block text-sm font-medium text-slate-300 mb-2">Location *</label>
                                    <input type="text" id="location" value="${wizardData.location}" placeholder="City, State"
                                        class="w-full px-4 py-3 glass-input rounded-lg text-white placeholder-slate-500"
                                        oninput="wizardData.location = this.value">
                                    <div id="location-error" class="error-text hidden">LOCATION REQUIRED</div>
                                </div>
                                
                                <!-- Technician Count -->
                                <div>
                                    <label class="block text-sm font-medium text-slate-300 mb-4">Number of Technicians</label>
                                    <div class="text-4xl font-bold text-white mb-4">${wizardData.technicianCount}</div>
                                    <input type="range" id="technician-count" min="1" max="500" value="${wizardData.technicianCount}"
                                        class="w-full"
                                        oninput="updateTechnicianCount(this.value)">
                                    <div class="flex justify-between text-xs text-slate-500 mt-2">
                                        <span>SMALL (1-25)</span>
                                        <span>MID-SIZE (26-100)</span>
                                        <span>LARGE (100+)</span>
                                    </div>
                                </div>
                                
                                <!-- Language -->
                                <div>
                                    <label class="block text-sm font-medium text-slate-300 mb-3">Primary Language of Operations</label>
                                    <div class="flex flex-wrap gap-2">
                                        ${['ENGLISH', 'SPANISH', 'FRENCH', 'OTHER'].map(lang => `
                                            <button onclick="selectLanguage('${lang}')" 
                                                class="px-4 py-2 rounded-full text-sm font-medium transition ${wizardData.language === lang ? 'bg-safety-orange text-white' : 'glass-input text-slate-300 hover:border-safety-orange/50'}">
                                                ${lang}
                                            </button>
                                        `).join('')}
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Navigation -->
                            <div class="flex justify-end pt-6">
                                <button id="step1-continue" onclick="validateAndContinue(1)" class="px-8 py-3 bg-safety-orange hover:bg-burnt-orange text-white font-semibold rounded-lg transition disabled:opacity-30 disabled:cursor-not-allowed" disabled>
                                    [CONTINUE →]
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Right Panel - Preview (45%) -->
                    <div class="w-full lg:w-[45%] bg-charcoal p-8 lg:p-12 flex flex-col justify-center border-l border-slate-800">
                        <div class="glass-card rounded-xl p-6 space-y-4">
                            <!-- Preview Header -->
                            <div class="flex items-center justify-between">
                                <h3 class="text-lg font-bold">${wizardData.facilityName || 'Your Facility'}</h3>
                                <div class="text-xs font-mono text-slate-400">${nodeId}</div>
                            </div>
                            
                            <!-- Terminal -->
                            <div class="bg-black rounded-lg p-4 font-mono text-xs space-y-1">
                                <div class="text-slate-400">[▸] PROVISIONING NODE: ${wizardData.facilityName || '...'}...</div>
                                <div class="text-slate-400">[▸] LOCATION: ${wizardData.location || '...'}...</div>
                                <div class="text-slate-400">[▸] TEAM SIZE: ${wizardData.technicianCount} TECHNICIANS...</div>
                                ${wizardData.facilityName && wizardData.location ? '<div class="text-success-green">[✓] FACILITY PROFILE CONFIGURED</div>' : ''}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }
        
        function updateFacilityName(value) {
            wizardData.facilityName = value;
            // Update preview elements directly without full re-render
            const previewTitle = document.querySelector('.glass-card h3');
            if (previewTitle) {
                previewTitle.textContent = wizardData.facilityName || 'Your Facility';
            }
            const terminalLines = document.querySelector('.bg-black.terminal-line') || document.querySelector('.bg-black');
            if (terminalLines) {
                // Update terminal preview text
                const lines = terminalLines.innerHTML;
                if (wizardData.facilityName && wizardData.location) {
                    if (!lines.includes('[✓] FACILITY PROFILE CONFIGURED')) {
                        terminalLines.innerHTML = lines + '<div class="text-success-green">[✓] FACILITY PROFILE CONFIGURED</div>';
                    }
                }
            }
        }
        
        function updateTechnicianCount(value) {
            wizardData.technicianCount = parseInt(value);
            // Update the count display directly
            const countDisplay = document.querySelector('.text-4xl.font-bold');
            if (countDisplay) {
                countDisplay.textContent = wizardData.technicianCount;
            }
        }
        
        function selectLanguage(lang) {
            wizardData.language = lang;
            // Update button styles directly without re-render
            const buttons = document.querySelectorAll('[onclick^="selectLanguage"]');
            buttons.forEach(btn => {
                const btnLang = btn.getAttribute('onclick').match(/'([^']+)'/)[1];
                if (btnLang === lang) {
                    btn.className = 'px-4 py-2 rounded-full text-sm font-medium transition bg-safety-orange text-white';
                } else {
                    btn.className = 'px-4 py-2 rounded-full text-sm font-medium transition glass-input text-slate-300 hover:border-safety-orange/50';
                }
            });
        }
        
        function initializeStepEvents(step) {
            if (step === 1) {
                const facilityInput = document.getElementById('facility-name');
                const locationInput = document.getElementById('location');
                const continueBtn = document.getElementById('step1-continue');

                const checkForm = () => {
                    const isValid = facilityInput.value.trim() && locationInput.value.trim();
                    continueBtn.disabled = !isValid;
                };

                facilityInput.addEventListener('input', checkForm);
                locationInput.addEventListener('input', checkForm);
            } else if (step === 2) {
                const continueBtn = document.getElementById('step2-continue');
                if (continueBtn && wizardData.industry) {
                    continueBtn.disabled = false;
                }
            } else if (step === 4) {
                const continueBtn = document.getElementById('step4-continue');
                const errorElement = document.getElementById('modules-error');
                if (continueBtn) {
                    if (wizardData.modules.length === 0) {
                        continueBtn.disabled = true;
                        continueBtn.setAttribute('disabled', 'disabled');
                    } else {
                        continueBtn.disabled = false;
                        continueBtn.removeAttribute('disabled');
                    }
                }
                if (errorElement) {
                    if (wizardData.modules.length === 0) {
                        errorElement.classList.remove('hidden');
                    } else {
                        errorElement.classList.add('hidden');
                    }
                }
            }
        }

        // =============================================
        // STEP 2: INDUSTRY AND COMPLIANCE
        // =============================================
        function getStep2HTML() {
            const compliance = COMPLIANCE_MAP[wizardData.industry];
            
            return `
                <div class="flex flex-col lg:flex-row min-h-screen">
                    <!-- Left Panel -->
                    <div class="w-full lg:w-[55%] p-8 lg:p-16 flex flex-col justify-center">
                        <div class="max-w-xl mx-auto w-full space-y-8 animate-in">
                            <div class="text-xs font-mono text-safety-orange">STEP 2 OF 6</div>
                            
                            <h1 class="text-3xl lg:text-4xl font-bold tracking-tight">What industry are you operating in?</h1>
                            <p class="text-slate-400">IndexField configures its terminology, compliance frameworks, and AI behavior to match your specific industry.</p>
                            
                            <!-- Industry Grid -->
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                ${INDUSTRIES.map(ind => `
                                    <div onclick="selectIndustry('${ind.id}')" 
                                        class="step-tile p-4 rounded-lg border cursor-pointer ${wizardData.industry === ind.id ? 'selected' : 'glass-input'}">
                                        <i class="fas ${ind.icon} text-2xl text-slate-400 mb-3"></i>
                                        <div class="font-semibold text-sm">${ind.name}</div>
                                        <div class="text-xs text-slate-500 mt-1">${ind.desc}</div>
                                    </div>
                                `).join('')}
                            </div>

                                    onclick="document.getElementById('manual-file').click()"
                                    ondragover="event.preventDefault(); this.classList.add('border-safety-orange/50')"
                                    ondragleave="this.classList.remove('border-safety-orange/50')"
                                    ondrop="handleFileDrop(event)">
                                    ${wizardData.manualFile ? `
                                        <div class="space-y-2">
                                            <i class="fas fa-file-pdf text-3xl text-safety-orange"></i>
                                            <div class="text-sm text-white">${wizardData.manualFile.name}</div>
                                            <div class="text-xs text-slate-400">${(wizardData.manualFile.size / 1024 / 1024).toFixed(2)} MB</div>
                                        </div>
                                    ` : `
                                        <div class="space-y-2">
                                            <i class="fas fa-cloud-upload-alt text-3xl text-slate-500"></i>
                                            <div class="text-sm text-slate-400">Drop file here or click to browse</div>
                                            <div class="text-xs text-slate-500">PDF, DOCX, TXT · MAX 500MB</div>
                                        </div>
                                    `}
                                </div>
                                <input type="file" id="manual-file" accept=".pdf,.docx,.txt" class="hidden" onchange="handleFileSelect(event)">
                                
                                <div class="text-center mt-2">
                                    <button onclick="skipManual()" class="text-xs text-slate-500 hover:text-slate-300 underline">SKIP — I'LL DO THIS LATER</button>
                                </div>
                            </div>
                            
                            <div class="flex justify-between pt-6">
                                <button onclick="goToStep(${isInvitedUser ? 5 : 5})" class="px-6 py-3 glass-input rounded-lg text-white hover:border-safety-orange/50 transition">
                                    [← BACK]
                                </button>
                                <button onclick="deployEnvironment()" class="px-8 py-3 bg-safety-orange hover:bg-burnt-orange text-white font-semibold rounded-lg transition">
                                    DEPLOY MY INDEXFIELD ENVIRONMENT
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Right Panel -->
                    <div class="w-full lg:w-[45%] bg-charcoal p-8 lg:p-12 flex flex-col justify-center border-l border-slate-800">
                        <div class="glass-card rounded-xl p-6 space-y-4">
                            <h3 class="text-lg font-bold">Asset Registry Preview</h3>
                            
                            ${wizardData.criticalAsset ? `
                                <div class="p-3 rounded-lg bg-safety-orange/5 border border-safety-orange/20 animate-pulse">
                                    <div class="flex items-center gap-3">
                                        <span class="w-2 h-2 rounded-full bg-safety-orange"></span>
                                        <div class="flex-1">
                                            <div class="font-medium">${wizardData.criticalAsset}</div>
                                            <div class="text-xs text-slate-400 mt-1">Status: ● UNDOCUMENTED</div>
                                        </div>
                                    </div>
                                    <div class="text-xs text-slate-500 mt-2">Last Service: UNKNOWN · Maintenance: UNSCHEDULED</div>
                                </div>
                            ` : `
                                <div class="text-slate-500 text-sm text-center py-8">
                                    Asset will appear here when named
                                </div>
                            `}
                            
                            <!-- Terminal -->
                            <div class="bg-black rounded-lg p-4 font-mono text-xs space-y-1">
                                ${wizardData.criticalAsset ? `
                                    <div class="text-slate-400">[▸] REGISTERING ASSET: ${wizardData.criticalAsset}...</div>
                                    <div class="text-success-green">[✓] ASSET REGISTERED — AWAITING MANUAL</div>
                                ` : '<div class="text-slate-400">[▸] WAITING FOR ASSET NAME...</div>'}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }
        
        function updateCriticalAsset(value) {
            wizardData.criticalAsset = value;
            renderStep(currentStep);
        }
        
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                wizardData.manualFile = file;
                renderStep(currentStep);
            }
        }
        
        function handleFileDrop(event) {
            event.preventDefault();
            const file = event.dataTransfer.files[0];
            if (file && (file.type === 'application/pdf' || file.type === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' || file.type === 'text/plain')) {
                wizardData.manualFile = file;
                renderStep(currentStep);
            }
        }
        
        function skipManual() {
            wizardData.manualFile = null;
            document.getElementById('manual-file').value = '';
            renderStep(currentStep);
        }

        // =============================================
        // VALIDATION & NAVIGATION
        // =============================================
        function validateAndContinue(step) {
            console.log('validateAndContinue called for step:', step);
            let isValid = true;
            let errorElementId = '';
            
            switch(step) {
                case 1:
                    if (!wizardData.facilityName.trim()) {
                        isValid = false;
                        errorElementId = 'facility-name-error';
                        document.getElementById('facility-name-error').classList.remove('hidden');
                    } else {
                        document.getElementById('facility-name-error').classList.add('hidden');
                    }
                    
                    if (!wizardData.location.trim()) {
                        isValid = false;
                        errorElementId = 'location-error';
                        document.getElementById('location-error').classList.remove('hidden');
                    } else {
                        document.getElementById('location-error').classList.add('hidden');
                    }
                    break;
                    
                case 2:
                    if (!wizardData.industry) {
                        isValid = false;
                        errorElementId = 'industry-error';
                        document.getElementById('industry-error').classList.remove('hidden');
                    } else {
                        document.getElementById('industry-error').classList.add('hidden');
                    }
                    break;
                    
                case 3:
                    if (!wizardData.role) {
                        isValid = false;
                        errorElementId = 'role-error';
                        document.getElementById('role-error').classList.remove('hidden');
                    } else {
                        document.getElementById('role-error').classList.add('hidden');
                    }
                    break;
                    
                case 4:
                    if (wizardData.modules.length === 0) {
                        isValid = false;
                        errorElementId = 'modules-error';
                        document.getElementById('modules-error').classList.remove('hidden');
                    } else {
                        document.getElementById('modules-error').classList.add('hidden');
                    }
                    console.log('Step 4 validation - isValid:', isValid, 'modules:', wizardData.modules);
                    break;
            }
            
            if (isValid) {
                const nextStep = step + 1;
                console.log('Validation passed, going to step:', nextStep);
                if (isInvitedUser) {
                    // Skip steps for invited users
                    if (step === 3) goToStep(6);
                    else goToStep(nextStep);
                } else {
                    goToStep(nextStep);
                }
            }
        }
        
        function goToStep(step) {
            console.log('goToStep called with:', step);
            currentStep = step;
            renderStep(step);
        }

        // =============================================
        // DEPLOY
        // =============================================
        async function deployEnvironment() {
            const overlay = document.getElementById('deploy-overlay');
            const terminal = document.getElementById('deploy-terminal');
            overlay.classList.remove('hidden');
            
            const lines = [
                `[▸] PROVISIONING FACILITY NODE: ${wizardData.facilityName}...`,
                `[▸] ASSIGNING ROLE: ${ROLES.find(r => r.id === wizardData.role)?.name}...`,
                `[▸] ACTIVATING MODULES: ${wizardData.modules.length}/6...`,
                `[▸] LOADING ${INDUSTRIES.find(i => i.id === wizardData.industry)?.name} SCHEMA...`,
                `[▸] IMPORTING ASSET: ${wizardData.criticalAsset}...`,
                `[▸] APPLYING PRIORITY CONFIGURATION...`
            ];
            
            if (wizardData.industry && COMPLIANCE_MAP[wizardData.industry]) {
                lines.push(`[▸] CONFIGURING COMPLIANCE FRAMEWORK: ${COMPLIANCE_MAP[wizardData.industry]}...`);
            }
            
            if (wizardData.manualFile) {
                lines.push(`[▸] UPLOADING MANUAL: ${wizardData.manualFile.name}...`);
                lines.push(`[▸] EXTRACTING MAINTENANCE INTERVALS...`);
                lines.push(`[▸] BUILDING KNOWLEDGE GRAPH...`);
                lines.push(`[▸] INDEXING DOCUMENT...`);
            }
            
            lines.push(`[✓] INDEXFIELD ENVIRONMENT READY`);
            lines.push(`[✓] WELCOME TO ${wizardData.facilityName.toUpperCase()} DASHBOARD`);
            
            // Display lines with animation
            for (let i = 0; i < lines.length; i++) {
                await new Promise(resolve => setTimeout(resolve, 400));
                terminal.innerHTML += `<div class="terminal-line ${lines[i].includes('✓') ? 'text-success-green' : 'text-slate-400'}">${lines[i]}</div>`;
            }
            
            // Hold on final line
            await new Promise(resolve => setTimeout(resolve, 1500));
            
            // Save data to Supabase
            await saveWizardData();
            
            // Fade out and redirect
            overlay.style.opacity = '0';
            overlay.style.transition = 'opacity 800ms';
            
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 800);
        }
        
        async function saveWizardData() {
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (!session) return;
                
                const token = session.access_token;
                
                const payload = {
                    facility_name: wizardData.facilityName,
                    location: wizardData.location,
                    technician_count: wizardData.technicianCount,
                    industry: wizardData.industry,
                    primary_equipment: wizardData.primaryEquipment || wizardData.criticalAsset || 'Centrifugal Pump',
                    modules_selected: wizardData.modules,
                    priorities: wizardData.priorities,
                    critical_asset: wizardData.criticalAsset || '',
                    role: wizardData.role
                };
                
                const response = await fetch(`${window.location.origin}/api/facility/setup`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) {
                    console.error('Facility setup request failed:', await response.text());
                }
                
                // Upload manual if provided
                if (wizardData.manualFile) {
                    const formData = new FormData();
                    formData.append('file', wizardData.manualFile);
                    
                    await fetch(`${window.location.origin}/api/sandbox/upload`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`
                        },
                        body: formData
                    });
                }
                
            } catch (e) {
                console.error('Failed to save wizard data:', e);
                // Show error but continue to dashboard
            }
        }
        
        // Initialize on load
        document.addEventListener('DOMContentLoaded', initWizard);
    </script>
</body>
</html>
