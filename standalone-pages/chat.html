<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask Questions - IndexField</title>
    <link rel="icon" href="data:,">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase-config.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: {
                        charcoal: '#111827',
                        graphite: '#1F2937',
                        slate: '#475569',
                        steel: '#64748B',
                        'light-slate': '#94A3B8',
                        'off-white': '#F8FAFC',
                        'safety-orange': '#F97316',
                        'burnt-orange': '#EA580C',
                        'success-green': '#22C55E',
                        'warning-amber': '#FACC15',
                        'critical-red': '#EF4444',
                        'data-cyan': '#06B6D4',
                        brand: {
                            bg: '#111827', surface: '#1F2937', card: '#1F2937', border: '#374151', hover: '#374151',
                            accent: '#F97316', accent2: '#EA580C', text: '#94A3B8', textLight: '#F8FAFC', verified: '#22C55E'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="selection:bg-safety-orange selection:text-white">
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div class="bg-grid"></div>
    
    <div class="relative z-10 flex h-screen flex-col">
        <header class="h-16 border-b border-white/5 flex items-center justify-between px-4 lg:px-6 glass-card">
            <div class="flex items-center gap-3">
                <i class="fas fa-comments text-light-slate"></i>
                <span class="font-medium text-sm sm:text-base text-white">Ask Questions</span>
                <span class="text-[10px] font-mono text-light-slate bg-white/5 px-2 py-1 rounded border border-white/10">
                    <span class="w-1.5 h-1.5 rounded-full bg-[#22C55E] inline-block mr-1.5"></span>FACILITY INTERNAL
                </span>
            </div>
            <button onclick="handleLogout()" class="text-[10px] font-mono text-white font-bold bg-[#F97316]/20 border border-[#F97316]/40 px-3 py-1.5 rounded hover:bg-[#F97316]/30 transition flex items-center gap-2">
                <i class="fas fa-sign-out-alt"></i> LOG OUT
            </button>
        </header>
        
        <main class="flex-1 flex overflow-hidden">
            <!-- Left: Chat -->
            <div class="flex-1 flex flex-col border-r border-white/5 overflow-hidden">
                <div id="messages" class="flex-1 overflow-y-auto px-4 py-6 space-y-4">
                    <div id="welcome-message" class="max-w-xl mx-auto py-6">
                        <div class="panel-section p-4 text-center">
                            <i class="fas fa-robot text-4xl text-[#F97316] mb-4 inline-block"></i>
                            <h1 class="text-2xl font-bold text-white mb-2">Ask Questions</h1>
                            <p class="text-sm text-light-slate">Upload a manual and start asking questions about your equipment</p>
                        </div>
                    </div>
                </div>
                
                <!-- Input Area -->
                <div class="border-t border-white/5 p-4 glass-card">
                    <div class="flex gap-3">
                        <input type="text" id="chat-input" placeholder="💬 Ask a question..." class="flex-1 px-4 py-3 glass-input rounded-lg text-sm text-white" />
                        <button onclick="sendMessage()" class="px-6 py-3 bg-[#F97316] text-black font-bold rounded-lg hover:bg-[#EA580C] transition">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Right: Sources/PDF Viewer -->
            <div class="w-1/3 border-l border-white/5 flex flex-col bg-black/40">
                <div class="p-4 border-b border-white/5 flex items-center justify-between">
                    <span class="text-sm font-semibold">Sources</span>
                    <button onclick="closeSources()" class="text-light-slate hover:text-white">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div id="sources-panel" class="flex-1 overflow-y-auto p-4">
                    <p class="text-xs text-light-slate text-center py-8">Ask a question to see source materials</p>
                </div>
            </div>
        </main>
    </div>
    
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 space-y-2"></div>

    <script>
        const API_URL = 'http://localhost:8000';
        
        async function guardSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            function getStoredDemoSession() {
                try {
                    const raw = localStorage.getItem('indexfield-demo-session');
                    return JSON.parse(raw);
                } catch { return null; }
            }
            const demoSession = getStoredDemoSession();
            if (!session && !demoSession) {
                window.location.href = '../signin.html';
            }
        }

        function showToast(text, type = 'brand') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `glass-card border-l-4 ${type === 'brand' ? 'border-[#22C55E]' : 'border-[#F97316]'} px-4 py-3 rounded shadow-2xl text-xs flex items-center gap-3`;
            toast.innerHTML = `<i class="fas ${type === 'brand' ? 'fa-check-circle text-[#22C55E]' : 'fa-info-circle text-[#F97316]'}"></i> <span>${text}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            // Add user message
            const messagesEl = document.getElementById('messages');
            const userMsg = document.createElement('div');
            userMsg.className = 'flex gap-3 flex-row-reverse animate-in';
            userMsg.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center"><i class="fas fa-user text-xs"></i></div>
                <div class="msg-user px-4 py-3 rounded-2xl max-w-[90%]"><p class="text-sm">${text}</p></div>
            `;
            messagesEl.appendChild(userMsg);
            input.value = '';
            messagesEl.scrollTop = messagesEl.scrollHeight;

            // Fetch response from backend
            try {
                const response = await fetch(`${API_URL}/api/query`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: text })
                });
                const data = await response.json();
                
                const aiMsg = document.createElement('div');
                aiMsg.className = 'flex gap-3 animate-in';
                aiMsg.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-gradient-to-br from-[#F97316]/20 to-[#22C55E]/20 flex items-center justify-center">
                        <i class="fas fa-robot text-xs text-[#F97316]"></i>
                    </div>
                    <div class="msg-ai px-4 py-3 rounded-2xl max-w-[90%]">
                        <p class="text-sm">${data.response || 'No response'}</p>
                        ${data.sources ? `<div class="text-xs text-[#06B6D4] mt-2">Sources: ${data.sources.length}</div>` : ''}
                    </div>
                `;
                messagesEl.appendChild(aiMsg);
                messagesEl.scrollTop = messagesEl.scrollHeight;
            } catch (err) {
                showToast('Failed to get response: ' + err.message, 'accent');
            }
        }

        function closeSources() {
            document.querySelector('.w-1/3').classList.add('hidden');
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            localStorage.removeItem('indexfield-demo-session');
            window.location.href = '../signin.html';
        }

        guardSession();
        
        document.getElementById('chat-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
