<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | IndexField</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="favicon.png">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: { brand: { bg: '#050505', card: '#0A0A0A', border: '#1A1A1A', accent: '#E5E5E5' } },
                }
            }
        }
    </script>
    <style>
        body { background-color: #050505; color: #E5E5E5; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; overflow: hidden; }
        
        /* Subtle Engineering Grid Background */
        .bg-grid {
            position: absolute; inset: 0; z-index: 0;
            background-size: 30px 30px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px), 
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
        }

        /* Ambient background glow (Very subtle) */
        .ambient-glow {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 600px; height: 300px; background: rgba(255, 255, 255, 0.03);
            filter: blur(100px); border-radius: 50%; z-index: 0; pointer-events: none;
        }

        /* Clean Entrance Animation */
        @keyframes subtleFade { from { opacity: 0; transform: translateY(10px) scale(0.99); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .animate-in { animation: subtleFade 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

        /* Sleek Input Fields */
        .input-field {
            background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff; transition: all 0.2s ease; outline: none;
        }
        .input-field:focus { border-color: rgba(255, 255, 255, 0.3); background: rgba(255, 255, 255, 0.04); }

        /* The thin gradient top border representing "active node" */
        .card-accent-line {
            position: absolute; top: 0; left: 0; width: 100%; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            opacity: 0.5;
        }

        /* Tab styling */
        .auth-tab {
            transition: all 0.2s ease;
            border-bottom: 2px solid transparent;
            cursor: pointer;
        }
        .auth-tab.active {
            border-bottom-color: #fff;
            color: #fff;
        }
        .auth-tab:not(.active) {
            color: #666;
        }
        .auth-tab:hover:not(.active) {
            color: #999;
        }

        /* Error/Success messages */
        .auth-message {
            font-size: 12px;
            padding: 8px 12px;
            border-radius: 8px;
            margin-top: 12px;
            display: none;
        }
        .auth-message.error {
            display: block;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
        }
        .auth-message.success {
            display: block;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #4ade80;
        }

        /* Invite banner styling */
        .invite-banner {
            background: rgba(249, 115, 22, 0.1);
            border: 1px solid rgba(249, 115, 22, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body class="selection:bg-white selection:text-black relative">

    <!-- Background Elements -->
    <div class="ambient-glow"></div>
    <div class="bg-grid"></div>

    <!-- Login Modal Container -->
    <div class="w-full max-w-[400px] px-6 relative z-10 animate-in">
        
        <!-- Logo Header -->
        <div class="flex flex-col items-center mb-8">
            <img src="favicon.png" alt="IndexField Logo" class="w-8 h-8 mb-4 rounded">
            <h1 id="auth-heading" class="text-xl font-medium tracking-tight text-white mb-1">Sign in to IndexField</h1>
            <p class="text-sm text-[#888888]">Secure Industrial Intelligence</p>
        </div>

        <!-- Invite Banner (hidden by default, shown for team invites) -->
        <div id="invite-banner" class="invite-banner hidden">
            <div class="flex items-start gap-3">
                <i class="fas fa-envelope text-orange-400 mt-1"></i>
                <div>
                    <p class="text-sm text-white font-medium" id="invite-message">You have been invited to join a facility</p>
                </div>
            </div>
        </div>

        <!-- The Card -->
        <div class="bg-brand-card/80 backdrop-blur-xl border border-brand-border rounded-xl p-6 relative overflow-hidden shadow-2xl">
            <!-- Accent Line -->
            <div class="card-accent-line"></div>

            <!-- Auth Mode Tabs -->
            <div class="flex gap-6 mb-6 border-b border-[rgba(255,255,255,0.08)] pb-0">
                <button onclick="switchTab('signin')" id="tab-signin" class="auth-tab active pb-3 text-sm font-medium">Sign In</button>
                <button onclick="switchTab('signup')" id="tab-signup" class="auth-tab pb-3 text-sm font-medium">Create Account</button>
            </div>

            <!-- Sign In Form -->
            <form id="signin-form" class="space-y-4" onsubmit="handleSignIn(event)">
                <div>
                    <label class="block text-xs font-medium text-[#A1A1A1] mb-1.5">Email</label>
                    <input type="email" id="signin-email" placeholder="you@example.com" class="w-full input-field rounded-lg px-3 py-2 text-sm placeholder-[#444444]" required>
                </div>
                
                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="block text-xs font-medium text-[#A1A1A1]">Password</label>
                        <a href="#" onclick="handleForgotPassword(event)" class="text-xs text-[#888888] hover:text-white transition">Forgot?</a>
                    </div>
                    <input type="password" id="signin-password" placeholder="••••••••" class="w-full input-field rounded-lg px-3 py-2 text-sm placeholder-[#444444]" required minlength="8">
                </div>

                <!-- Primary Action Button -->
                <button type="submit" id="signin-btn" class="w-full bg-white hover:bg-gray-200 text-black font-medium py-2.5 rounded-lg transition-colors duration-200 text-sm mt-2">
                    Sign In
                </button>

                <!-- OR divider and Google OAuth -->
                <div class="flex items-center my-3">
                    <div class="flex-1 h-px bg-[rgba(255,255,255,0.06)]"></div>
                    <div class="px-3 text-xs text-[#888888]">OR</div>
                    <div class="flex-1 h-px bg-[rgba(255,255,255,0.06)]"></div>
                </div>

                <button type="button" id="google-btn" onclick="handleGoogleSignIn()" class="w-full bg-white/10 hover:bg-white/20 text-white font-medium py-2.5 rounded-lg transition-colors duration-200 text-sm">
                    <img src="https://www.svgrepo.com/show/355037/google.svg" alt="Google" class="inline-block w-4 h-4 mr-2 align-text-bottom"> Sign in with Google
                </button>
            </form>

            <!-- Sign Up Form (Hidden by default) -->
            <form id="signup-form" class="space-y-4 hidden" onsubmit="handleSignUp(event)">
                <div>
                    <label class="block text-xs font-medium text-[#A1A1A1] mb-1.5">Full Name</label>
                    <input type="text" id="signup-name" placeholder="John Smith" class="w-full input-field rounded-lg px-3 py-2 text-sm placeholder-[#444444]" required>
                </div>
                
                <div>
                    <label class="block text-xs font-medium text-[#A1A1A1] mb-1.5">Email</label>
                    <input type="email" id="signup-email" placeholder="you@example.com" class="w-full input-field rounded-lg px-3 py-2 text-sm placeholder-[#444444]" required>
                </div>
                
                <div>
                    <label class="block text-xs font-medium text-[#A1A1A1] mb-1.5">Password</label>
                    <input type="password" id="signup-password" placeholder="Minimum 8 characters" class="w-full input-field rounded-lg px-3 py-2 text-sm placeholder-[#444444]" required minlength="8">
                </div>

                <button type="submit" id="signup-btn" class="w-full bg-white hover:bg-gray-200 text-black font-medium py-2.5 rounded-lg transition-colors duration-200 text-sm mt-2">
                    CREATE MY ACCOUNT →
                </button>

                <p class="text-center text-xs text-[#666666] mt-4">
                    Free account. No card. No commitment.
                </p>
            </form>

            <!-- Auth Messages -->
            <div id="auth-message" class="auth-message"></div>
        </div>

        <!-- Footer Links -->
        <div class="mt-6 flex justify-between items-center text-[11px] font-mono text-[#666666]">
            <span>System Status: <span class="text-green-500">Operational</span></span>
            <div class="space-x-3">
                <a href="#" class="hover:text-white transition">Help</a>
                <a href="#" class="hover:text-white transition">Privacy</a>
            </div>
        </div>

    </div>

    <script>
        // Supabase client is initialized in supabase-config.js (loaded in <head>)

        // CHECK IF ALREADY LOGGED IN
        // =============================================
        (async function checkSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                // Check if user needs to go through setup
                await checkSetupAndRedirect(session);
            }
            
            // Check for invite token in URL
            const urlParams = new URLSearchParams(window.location.search);
            const inviteToken = urlParams.get('token');
            if (inviteToken) {
                showInviteBanner(inviteToken);
            }
        })();

        // =============================================
        // CHECK SETUP STATUS AND REDIRECT
        // =============================================
        async function checkSetupAndRedirect(session) {
            try {
                const response = await fetch('/api/auth/user/setup-check', {
                    headers: {
                        'Authorization': `Bearer ${session.access_token}`
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    if (data.needs_setup) {
                        window.location.href = 'setup-wizard.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                } else {
                    // If endpoint fails, default to dashboard
                    window.location.href = 'dashboard.html';
                }
            } catch (err) {
                // If check fails, default to dashboard
                window.location.href = 'dashboard.html';
            }
        }

        // =============================================
        // SHOW INVITE BANNER
        // =============================================
        async function showInviteBanner(token) {
            try {
                // Get facility info from invite token
                // For now, just show a generic message
                const banner = document.getElementById('invite-banner');
                const message = document.getElementById('invite-message');
                banner.classList.remove('hidden');
                message.textContent = 'You have been invited to join a facility on IndexField';
                
                // Store token for use after signup/signin
                window.inviteToken = token;
            } catch (err) {
                console.error('Failed to show invite banner:', err);
            }
        }

        // =============================================
        // TAB SWITCHING
        // =============================================
        function switchTab(tab) {
            const signinForm = document.getElementById('signin-form');
            const signupForm = document.getElementById('signup-form');
            const tabSignin = document.getElementById('tab-signin');
            const tabSignup = document.getElementById('tab-signup');
            const heading = document.getElementById('auth-heading');
            clearMessage();

            if (tab === 'signin') {
                signinForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                tabSignin.classList.add('active');
                tabSignup.classList.remove('active');
                heading.textContent = 'Sign in to IndexField';
            } else {
                signinForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
                tabSignin.classList.remove('active');
                tabSignup.classList.add('active');
                heading.textContent = 'Create your account';
            }
        }

        // =============================================
        // MESSAGE DISPLAY
        // =============================================
        function showMessage(text, type = 'error') {
            const el = document.getElementById('auth-message');
            el.textContent = text;
            el.className = `auth-message ${type}`;
        }

        function clearMessage() {
            const el = document.getElementById('auth-message');
            el.className = 'auth-message';
            el.textContent = '';
        }

        // =============================================
        // SIGN IN WITH EMAIL/PASSWORD
        // =============================================
        async function handleSignIn(e) {
            e.preventDefault();
            clearMessage();
            
            const btn = document.getElementById('signin-btn');
            const email = document.getElementById('signin-email').value.trim();
            const password = document.getElementById('signin-password').value;
            
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i>Authenticating...';
            btn.disabled = true;

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) {
                    // Specific error messages
                    if (error.message.includes('Invalid login credentials')) {
                        showMessage('INCORRECT PASSWORD · TRY AGAIN', 'error');
                    } else if (error.message.includes('Email not confirmed')) {
                        showMessage('PLEASE CONFIRM YOUR EMAIL FIRST', 'error');
                    } else {
                        showMessage('CONNECTION ISSUE · RETRY', 'error');
                    }
                    btn.innerHTML = 'Sign In';
                    btn.disabled = false;
                    return;
                }

                btn.innerHTML = '<i class="fas fa-check mr-2"></i>Welcome back!';
                
                // Handle invite token if present
                if (window.inviteToken) {
                    await handleInviteAcceptance(data.session, window.inviteToken);
                } else {
                    // Check setup status and redirect
                    await checkSetupAndRedirect(data.session);
                }

            } catch (err) {
                showMessage('CONNECTION ISSUE · RETRY', 'error');
                btn.innerHTML = 'Sign In';
                btn.disabled = false;
            }
        }

        // =============================================
        // SIGN IN WITH GOOGLE (Supabase OAuth)
        // =============================================
        async function handleGoogleSignIn() {
            clearMessage();
            const btn = document.getElementById('google-btn');
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i>Redirecting...';
            btn.disabled = true;
            try {
                const redirectTo = window.location.origin + '/dashboard.html';
                const { error } = await supabaseClient.auth.signInWithOAuth({ provider: 'google', options: { redirectTo } });
                if (error) {
                    showMessage('Failed to start Google sign-in flow', 'error');
                    btn.innerHTML = 'Sign in with Google';
                    btn.disabled = false;
                }
                // Supabase will redirect the browser; nothing else to do here.
            } catch (err) {
                showMessage('CONNECTION ISSUE · RETRY', 'error');
                btn.innerHTML = 'Sign in with Google';
                btn.disabled = false;
            }
        }

        // =============================================
        // HANDLE INVITE ACCEPTANCE
        // =============================================
        async function handleInviteAcceptance(session, token) {
            try {
                // Call backend to accept invite
                const response = await fetch('/api/facility/accept-invite', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${session.access_token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ token })
                });
                
                if (response.ok) {
                    window.location.href = 'dashboard.html';
                } else {
                    // If invite acceptance fails, still redirect to setup
                    window.location.href = 'setup-wizard.html';
                }
            } catch (err) {
                console.error('Failed to accept invite:', err);
                window.location.href = 'setup-wizard.html';
            }
        }

        // =============================================
        // SIGN UP WITH EMAIL/PASSWORD
        // =============================================
        async function handleSignUp(e) {
            e.preventDefault();
            clearMessage();

            const btn = document.getElementById('signup-btn');
            const name = document.getElementById('signup-name').value.trim();
            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value;

            if (password.length < 8) {
                showMessage('PASSWORD MUST BE AT LEAST 8 CHARACTERS', 'error');
                return;
            }

            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i>Creating account...';
            btn.disabled = true;

            try {
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: name,
                        },
                        emailRedirectTo: window.location.origin + '/setup-wizard.html',
                        emailConfirm: false
                    }
                });

                if (error) {
                    if (error.message.includes('User already registered')) {
                        showMessage('NO ACCOUNT FOUND · CREATE ONE ABOVE', 'error');
                    } else {
                        showMessage(error.message || 'Failed to create account', 'error');
                    }
                    btn.innerHTML = 'CREATE MY ACCOUNT →';
                    btn.disabled = false;
                    return;
                }

                if (data.user && data.session) {
                    // Create profile record
                    await createProfile(data.user.id, name, company, email);
                    
                    btn.innerHTML = '<i class="fas fa-check mr-2"></i>Account created!';
                    
                    // Handle invite token if present
                    if (window.inviteToken) {
                        await handleInviteAcceptance(data.session, window.inviteToken);
                    } else {
                        // Redirect to setup
                        setTimeout(() => {
                            window.location.href = 'setup-wizard.html';
                        }, 500);
                    }
                } else {
                    showMessage('Please check your email to confirm your account', 'success');
                    btn.innerHTML = '<i class="fas fa-envelope mr-2"></i>Check your email';
                    btn.disabled = false;
                }

            } catch (err) {
                showMessage('CONNECTION ISSUE · RETRY', 'error');
                btn.innerHTML = 'CREATE MY ACCOUNT →';
                btn.disabled = false;
            }
        }

        // =============================================
        // CREATE PROFILE RECORD
        // =============================================
        async function createProfile(userId, fullName, companyName, email) {
            try {
                const response = await fetch('/api/auth/create-profile', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        user_id: userId,
                        full_name: fullName,
                        company_name: companyName,
                        email: email
                    })
                });
                
                // Don't fail the whole flow if profile creation fails
                // The profile can be created later
                if (!response.ok) {
                    console.error('Failed to create profile:', await response.text());
                }
            } catch (err) {
                console.error('Failed to create profile:', err);
            }
        }

        // =============================================
        // FORGOT PASSWORD
        // =============================================
        async function handleForgotPassword(e) {
            e.preventDefault();
            clearMessage();

            const email = document.getElementById('signin-email').value.trim();
            if (!email) {
                showMessage('ENTER YOUR EMAIL ADDRESS FIRST', 'error');
                return;
            }

            try {
                const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/signin.html'
                });

                if (error) {
                    showMessage(error.message, 'error');
                    return;
                }

                showMessage('Password reset email sent. Check your inbox.', 'success');
            } catch (err) {
                showMessage('CONNECTION ISSUE · RETRY', 'error');
            }
        }
    </script>
</body>
</html>
